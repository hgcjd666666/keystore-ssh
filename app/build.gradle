plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.dsh.keystore'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dsh.keystore'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2'
        resConfigs "zh", "en"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // BouncyCastle 的 jar 里带了 PQC/Picnic 等算法数据（lowmc*.bin.properties 约 1.3MB），
    // 我们只用 Ed25519，这些资源全部排掉
    packaging {
        resources {
            excludes += [
                "org/bouncycastle/pqc/**",
                "org/bouncycastle/**/*.properties",
            ]
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Ed25519 密钥生成（Android 的 Conscrypt 不保证提供 Ed25519 KeyPairGenerator）
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
